<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">dsh-laya: two routes cross one loopback boundary</title>
<desc id="fig-desc">The host registers laya_plan and laya_ask. laya_plan sends POST /plan across the loopback boundary to the Python sidecar and comes back with budget arithmetic that runs no forward pass. laya_ask sends POST /ask to the same sidecar, spends one forward pass, and fans out into three typed exits: noul returns a calibrated probability with a no/uncertain/yes band, choice returns one named label, score returns a position on an ascending scale. Answers, truncation data and warnings return to the host; state stays on this machine by default at 127.0.0.1:8787. A non-loopback sidecarUrl is allowed but warns once and changes the startup line to LEAVES THIS MACHINE. plan_questions() is the shared arithmetic behind both /plan and /ask.</desc>
