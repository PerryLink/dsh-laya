# dsh-laya - the Cordis row.
#
# `insert` adds the plugin to the host composition. Every value here is a
# default a user can override in their own patch; nothing is required, because a
# plugin that refuses to mount until it is configured is a plugin nobody tries.
#
# The sidecar URL is the one setting that matters. Point it at a running
# `laya-mcp serve` and this plugin becomes a thin, fast client of a model that is
# already warm. Leave it unset and the plugin will try to reach the default
# loopback port, and say clearly in its startup report when nothing is there -
# rather than failing at the first tool call, which is where a silent
# misconfiguration usually surfaces.
- insert:
    - id: laya
      name: 'dsh-laya'
      config:
        # Where `laya-mcp serve` is listening. Loopback by default: the sidecar
        # has no authentication and should not be exposed.
        sidecarUrl: 'http://127.0.0.1:8787'

        # Per-request timeout in milliseconds. Model inference is 30-500 ms once
        # warm, but the *first* call after a cold start can pay a model load of
        # several seconds, so this is deliberately generous.
        requestTimeoutMs: 120000

        # What to do when nothing is answering at sidecarUrl.
        #   'never'  - assume something else manages it (the default)
        #   'attach' - check /health on load; log clearly, start nothing
        #   'spawn'  - check /health, and if nothing answers, run spawnCommand
        # A sidecar already answering is always attached to and never touched, so
        # two harness sessions cannot put two models on one port. A sidecar this
        # plugin started is stopped when the plugin unmounts; one it did not start
        # is left exactly as it was found.
        lifecycle: never

        # The command to run for lifecycle: 'spawn'. An array, argv-style.
        #
        # Required, with no default: this plugin does not guess at an interpreter,
        # does not install anything and does not download weights. Launching a
        # sidecar the operator has *already installed* is a different thing, and
        # without it every session begins by starting a process by hand - and
        # begins failing again every time that process dies.
        #
        # On Windows a console script is a `.cmd` shim, which this resolves
        # through `cmd.exe /c`; pointing at `python -m laya_mcp` sidesteps that
        # entirely and is what the second example does.
        #
        #   spawnCommand: ['laya-mcp', 'serve']
        #   spawnCommand: ['python', '-m', 'laya_mcp', 'serve', '--model', 'english']
        spawnCommand: null

        # How long to wait for a spawned sidecar to answer /health, in
        # milliseconds. A cold start loads the checkpoint - and on a first run
        # downloads it - so this is generous deliberately. Timing out is reported
        # rather than fatal: the tools begin working whenever the sidecar does.
        spawnTimeoutMs: 120000

        # Log level: silent | warn | info | debug
        logLevel: info
